name: Flaky Test Experiment

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Podman
      - name: Checkout
        uses: actions/checkout@v5

      # 2. Show environment
      - name: Show environment
        run: |
          echo "=== System ==="
          uname -a

          echo
          echo "=== Go version ==="
          go version

          echo
          echo "=== Commit ==="
          git rev-parse HEAD

      # 3. Run our intentionally flaky test 10 times
      - name: Run TestFlakyExperiment 10 times
        shell: bash
        run: |
          mkdir -p results
          echo "iteration,result" > results/results.csv

          echo "Running TestFlakyExperiment 10 times..."
          echo

          for i in $(seq 1 10); do
            echo "========================================"
            echo "Test execution $i / 10"
            echo "========================================"

            if go test ./pkg/ctime -run '^TestFlakyExperiment$' -count=1; then
              echo "$i,PASS" >> results/results.csv
              echo "RESULT: PASS"
            else
              echo "$i,FAIL" >> results/results.csv
              echo "RESULT: FAIL"
            fi

            echo
          done

      # 4. Analyze results
      - name: Analyze results
        shell: bash
        run: |
          PASS_COUNT=$(grep -c ',PASS$' results/results.csv || true)
          FAIL_COUNT=$(grep -c ',FAIL$' results/results.csv || true)
          TOTAL=$((PASS_COUNT + FAIL_COUNT))

          echo "========================================"
          echo "            TEST SUMMARY"
          echo "========================================"

          echo "Test: TestFlakyExperiment"
          echo "Total executions: $TOTAL"
          echo "PASS: $PASS_COUNT"
          echo "FAIL: $FAIL_COUNT"

          if [ "$TOTAL" -gt 0 ]; then
            echo "Failure rate: $(awk "BEGIN {printf \"%.2f%%\", ($FAIL_COUNT/$TOTAL)*100}")"
          fi

          echo
          echo "========== RAW RESULTS =========="
          cat results/results.csv

      # 5. Upload results
      - name: Upload test results
        uses: actions/upload-artifact@v5
        with:
          name: flaky-test-results
          path: results/results.csv
